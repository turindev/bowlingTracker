# Publishes the site to GitHub Pages. The repo root is the site — there is no
# build step — so the checkout is uploaded as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate league data
        run: node tools/validate.js

      - name: Check the handicap rule
        run: node tools/test-handicap.js

      - name: Check the split season
        run: node tools/test-season.js

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must already be switched on for the repo (Settings -> Pages ->
      # Source: GitHub Actions). The workflow token is not allowed to create
      # the Pages site itself, so there is no enabling it from here.
      - uses: actions/configure-pages@v5
      # Stamp the commit onto every local asset URL. Without this a browser
      # can serve a cached js/ or data/ file after a deploy, which would show
      # stale scores after a weekly update. The checked-in HTML keeps plain
      # paths so opening index.html straight off disk still works.
      - name: Version asset URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#((src|href)=\"(js|css|data|assets)/[^\"?]+)\"#\1?v=$v\"#g" index.html
          echo "Stamped with ?v=$v"
          grep -E '(src|href)="(js|css|data|assets)/' index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
