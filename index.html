<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Standings, averages and weekly scores for our bowling league.">
<meta name="theme-color" content="#0f1420">
<title>Bowling League Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%B3</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">🎳</span>
      <span class="brand-text">
        <strong id="league-name">Bowling League</strong>
        <small id="league-meta"></small>
      </span>
    </a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch colour theme">
      <span aria-hidden="true">◐</span>
    </button>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1">
  <div id="view" class="view"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p id="footer-note"></p>
  </div>
</footer>

<script src="data/league.js"></script>
<script src="js/stats.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/avatars.js"></script>
<script src="js/app.js"></script>
</body>
</html>
